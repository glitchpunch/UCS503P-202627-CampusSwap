<style>
    @layer base {
      html, body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
      body { overscroll-behavior-y: none; }
    }
    ::-webkit-scrollbar { display: none; }
    .swap-wire { stroke-dasharray: 8 8; animation: swapDash 1.6s linear infinite; }
    .swap-wire-alt { stroke-dasharray: 8 8; animation: swapDash 1.4s linear infinite; }
    @keyframes swapDash { to { stroke-dashoffset: 32; } }
    .shimmer-gradient {
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.35) 50%, rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: shimmerMove 2.6s infinite;
    }
    @keyframes shimmerMove { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .node-interactive-card { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease; }
    .node-interactive-card:hover { box-shadow: 0 18px 36px -10px rgba(15, 23, 42, 0.18); }
    .milestone-item { transition: all 0.25s cubic-bezier(0.2, 0, 0, 1); }
  </style>
</head>
